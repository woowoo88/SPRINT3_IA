[project]
name = "chargegrid-intelligence"
version = "1.1.1"
description = "Agente acadêmico para gerenciamento conversacional de recarga comercial."
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.30,<1.7",
  "langchain-google-genai>=2.0.0",
  "python-dotenv>=1.0.0",
  "google-auth==2.49.0",
  "requests==2.32.4",
  "websockets>=15.0.1,<16.0.0",
]

[tool.setuptools.packages.find]
include = ["chargegrid_intelligence*"]

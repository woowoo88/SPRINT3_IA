[project]
name = "chargegrid-intelligence"
version = "0.3.4"
description = "Agente academico para gerenciamento conversacional de recarga comercial."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.70,<1.3",
  "langchain-core>=0.3.30,<1.7",
  "ollama>=0.4.0",
  "python-dotenv>=1.0.0",
  "requests==2.32.4",
  "websockets>=15.0.1,<16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "chargegrid-intelligence"
version = "0.3.1"
description = "Agente academico para gerenciamento conversacional de recarga comercial."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.70",
  "langchain-core>=0.3.30",
  "ollama>=0.4.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
